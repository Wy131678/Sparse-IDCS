[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-idcs-crosshole-gpr"
version = "1.0.1"
description = "Sparse incremental IDCS for synthetic crosshole GPR traveltimes"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GPL-3.0-only"}
dependencies = ["numpy>=1.22.4", "scipy>=1.7.3", "matplotlib>=3.7.5", "gstools>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
